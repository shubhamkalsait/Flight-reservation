spring.application.name=FlightCheckInApplication
spring.datasource.url=${DATASOURCE_URL:jdbc:mysql://localhost:3306/checkin_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DATASOURCE_USER:root}
spring.datasource.password=${DATASOURCE_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
booking.service.url=${BOOKING_SERVICE_URL:http://localhost:8080/api/bookings}
server.port=8081
frontend.url=${FRONTEND_URL:http://localhost:5173}
