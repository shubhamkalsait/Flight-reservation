spring.application.name=FlightReservationApplication

spring.datasource.url=${DATASOURCE_URL:jdbc:mysql://localhost:3306/flightdb?createDatabaseIfNotExist=true}
spring.datasource.username=${DATASOURCE_USER:root}
spring.datasource.password=${DATASOURCE_PASSWORD:root}
frontend.url=${FRONTEND_URL:http://localhost:5173}

# Hibernate properties for MySQL
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.datasource.auto-commit=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
server.address=0.0.0.0
